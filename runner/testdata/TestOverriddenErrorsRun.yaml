---
meta:
  author: "tester"
  description: "Errors in overridden tests"
tests:
  - test_id: 1
    description: "fails twice (retry_once), forced to pass"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 413
          retry_once: true
  - test_id: 2
    description: "transport error in the first stage, the remaining stages must be skipped"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .ClosedPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 200
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 200
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 200
  - test_id: 3
    description: "invalid test definition, forced to pass"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          isolated: true
          log:
            expect_ids: [1, 2]
  - test_id: 4
    description: "runs after the overridden tests"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 200
