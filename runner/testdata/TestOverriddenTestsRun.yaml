---
meta:
  author: "tester"
  description: "Overridden tests are always run"
tests:
  - test_id: 1
    description: "fails, forced to pass (override is effective)"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 413
  - test_id: 2
    description: "passes, forced to pass (stale override)"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 200
  - test_id: 3
    description: "passes, forced to fail (override is effective)"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 200
  - test_id: 4
    description: "fails, forced to fail (stale override)"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 413
  - test_id: 5
    description: "runtime error (connection refused), forced to pass"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .ClosedPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 200
  - test_id: 6
    description: "fails, not overridden"
    stages:
      - input:
          dest_addr: "{{ .TestAddr }}"
          port: {{ .TestPort }}
          headers:
            User-Agent: "ModSecurity CRS 3 Tests"
            Accept: "*/*"
            Host: "none.host"
        output:
          status: 413
